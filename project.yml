name: DuoDemo
options:
  bundleIdPrefix: com.pvinis
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  DuoDemo:
    type: application
    platform: iOS
    sources:
      - path: DuoDemo
    info:
      path: DuoDemo/Info.plist
      properties:
        CFBundleDisplayName: Duo Demo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The Camera tab shows a live preview and, on iPhone Duo, mirrors it to the outer display for the person being photographed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvinis.DuoDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  DuoDemo:
    build:
      targets:
        DuoDemo: all
    run:
      config: Debug
